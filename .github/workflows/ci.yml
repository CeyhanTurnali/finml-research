name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (all post/tool extras + dev)
        run: pip install -e ".[blog01,macro,dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov --cov-report=term-missing
