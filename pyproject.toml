[project]
name = "finml-research"
version = "0.2.0"
description = "Applied research at the intersection of finance and machine learning: reproducible code behind each blog post"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
]

[project.optional-dependencies]
# One extra per post, so each can be installed on its own.
blog01 = ["yfinance", "scipy", "matplotlib", "pyarrow"]
dev = ["pytest", "pytest-cov", "ruff"]

# This repo is a collection of research folders, not an installable library:
# `pip install -e ".[...]"` installs dependencies only.
[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["hidden_constraint"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["blog/01-optimizer-hidden-constraint"]
testpaths = ["blog"]